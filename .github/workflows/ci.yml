name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 构建与测试（iOS Simulator）
    # 工具链门槛见 Package.swift：swift-tools-version 6.0 → Xcode 16+
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 打印可用的模拟器（排查用）
        run: xcrun simctl list devices available

      # 测试用例全部用 swift-testing 编写，xcodebuild test 会一并执行。
      # 若 runner 镜像里没有 iPhone 16，把下面的 name 换成上一步列出的任一机型即可。
      - name: 运行测试
        run: |
          xcodebuild test \
            -scheme CooDialog \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath TestResults.xcresult

      - name: 上传测试结果（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
